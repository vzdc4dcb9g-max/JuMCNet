dataset_name: Jujube12000
data_root: dataSets/Jujube12000
num_classes: 6

# Fixed class order. Do not rely on filesystem sorting.
class_names:
  - bianxing
  - gantiao
  - haozao
  - liekou
  - meibian
  - niaozhuo

class_names_en:
  bianxing: Deformed
  gantiao: Shriveled
  haozao: Normal
  liekou: Cracked
  meibian: Moldy
  niaozhuo: Bird-pecked

split:
  seed: 2222
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  output_dir: splits/Jujube12000/split_seed_2222

image:
  input_size: 224
  channels: 3

# ImageNet normalization for consistent preprocessing.
normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

loader:
  num_workers: 4
  pin_memory: true
  persistent_workers: false
