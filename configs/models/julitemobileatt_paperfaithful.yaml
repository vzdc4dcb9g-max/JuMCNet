model_name: julitemobileatt_paperfaithful
model_source: custom
pretrained: false
dropout: 0.0

# Fixed assumptions for paper-underspecified CoordAtt details.
se_reduction: 16
spatial_kernel: 3

ema:
  enabled: true
  decay: 0.9998
  min_decay: 0.0
  update_after_step: 0
  use_warmup: true
  warmup_gamma: 1.0
  warmup_power: 0.75
