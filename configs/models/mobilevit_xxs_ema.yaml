model_name: mobilevit_xxs_ema
model_source: timm
architecture_name: mobilevit_xxs
pretrained: false
dropout: 0.0

# Model-parameter exponential moving average. Validation model selection and
# the default best.pth use EMA weights; best_raw.pth keeps the raw control.
ema:
  enabled: true
  decay: 0.9998
  min_decay: 0.0
  update_after_step: 0
  use_warmup: true
  warmup_gamma: 1.0
  warmup_power: 0.75

# Explicitly disabled so this ablation isolates Model EMA only.
difficulty_weighted_loss:
  enabled: false
