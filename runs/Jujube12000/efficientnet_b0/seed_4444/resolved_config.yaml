dataset:
  dataset_name: Jujube12000
  data_root: "E:\\vsCodeWorkspace\\JujubeDefectBench\\dataSets\\Jujube12000"
  num_classes: 6
  class_names:
  - bianxing
  - gantiao
  - haozao
  - liekou
  - meibian
  - niaozhuo
  class_names_en:
    bianxing: Deformed
    gantiao: Shriveled
    haozao: Normal
    liekou: Cracked
    meibian: Moldy
    niaozhuo: Bird-pecked
  split:
    seed: 2222
    train_ratio: 0.7
    val_ratio: 0.1
    test_ratio: 0.2
    output_dir: "E:\\vsCodeWorkspace\\JujubeDefectBench\\splits\\Jujube12000\\split_seed_2222"
  image:
    input_size: 224
    channels: 3
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  loader:
    num_workers: 4
    pin_memory: true
    persistent_workers: false
experiment:
  experiment_name: "Jujube12000_efficientnet_b0_ema_seed_4444"
  output_root: E:\vsCodeWorkspace\JujubeDefectBench\runs
  epochs: 200
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.05
  optimizer: adamw
  warmup_epochs: 1
  scheduler: cosine
  label_smoothing: 0.0
  amp: true
  monitor: macro_f1
  monitor_mode: max
  save_last: true
  augmentation:
    random_resized_crop:
      scale:
      - 0.7
      - 1.0
      ratio:
      - 0.8
      - 1.25
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation_degrees: 15
    shear_degrees: 10
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.0
    random_erasing:
      probability: 0.25
      scale:
      - 0.02
      - 0.2
  output_namespace: ""
model:
  model_name: efficientnet_b0
  model_source: torchvision
  pretrained: false
  dropout: 0.2
  ema:
    enabled: true
    decay: 0.9998
    min_decay: 0.0
    update_after_step: 0
    use_warmup: true
    warmup_gamma: 1.0
    warmup_power: 0.75
train_seed: 4444
device: cuda
reproducibility:
  deterministic_algorithms: false
  deterministic_warn_only: false
  cudnn_benchmark: false
  cudnn_deterministic: true
  cublas_workspace_config: :4096:8
  pythonhashseed_env: '4444'
  torch_version: 2.6.0+cu124
  cuda_version: '12.4'
  cudnn_version: 90100
