dataset:
  dataset_name: Cassava
  data_root: E:\vsCodeWorkspace\JujubeDefectBench\dataSets\Cassava\train_images
  num_classes: 5
  class_names:
  - Cassava Bacterial Blight (CBB)
  - Cassava Brown Streak Disease (CBSD)
  - Cassava Green Mottle (CGM)
  - Cassava Mosaic Disease (CMD)
  - Healthy
  split:
    seed: 1111
    train_ratio: 0.7
    val_ratio: 0.1
    test_ratio: 0.2
    output_dir: "E:\\vsCodeWorkspace\\JujubeDefectBench\\splits\\Cassava\\split_seed_1111"
  image:
    input_size: 224
    channels: 3
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  loader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
experiment:
  experiment_name: "Cassava_mobilenetv4_conv_small_ema_seed_1111"
  output_namespace: ""
  output_root: "E:\\vsCodeWorkspace\\JujubeDefectBench\\runs"
  epochs: 200
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.05
  optimizer: adamw
  warmup_epochs: 1
  scheduler: cosine
  label_smoothing: 0.0
  amp: true
  train_repeat_factor: 1
  monitor: macro_f1
  monitor_mode: max
  save_last: true
  topk_ema: 0
  augmentation:
    random_resized_crop:
      scale:
      - 0.7
      - 1.0
      ratio:
      - 0.8
      - 1.25
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation_degrees: 15
    shear_degrees: 10
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.0
    random_erasing:
      probability: 0.25
      scale:
      - 0.02
      - 0.2
      value: random
model:
  model_name: mobilenetv4_conv_small
  model_source: timm
  pretrained: false
  dropout: 0.0
  ema:
    enabled: true
    decay: 0.9998
    min_decay: 0.0
    update_after_step: 0
    use_warmup: true
    warmup_gamma: 1.0
    warmup_power: 0.75
train_seed: 1111
device: cuda
reproducibility:
  deterministic_algorithms: false
  deterministic_warn_only: false
  cudnn_benchmark: false
  cudnn_deterministic: true
  cublas_workspace_config: :4096:8
  pythonhashseed_env: '1111'
  torch_version: 2.6.0+cu124
  cuda_version: '12.4'
  cudnn_version: 90100
